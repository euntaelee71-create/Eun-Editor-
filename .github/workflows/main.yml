name: Build EUN Editor APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android source ZIP
        run: |
          unzip -o EUNEditor-Android-1.zip -d extracted
          if [ -d extracted/EUNEditor ]; then
            cp -a extracted/EUNEditor/. .
          else
            cp -a extracted/. .
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EUN-Editor-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
