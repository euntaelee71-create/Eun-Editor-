name: Build EUN Editor APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -o EUNEditor-Android-1.zip -d extracted
          SETTINGS=$(find extracted -type f -name settings.gradle.kts -print -quit)
          if [ -z "$SETTINGS" ]; then
            echo "ERROR: ZIP mein settings.gradle.kts nahi mila"
            find extracted -maxdepth 4 -type f
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          cp -a "$PROJECT_DIR"/. .

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: EUN-Editor-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
